name: NutriRatio
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NutriRatio:
    type: application
    platform: iOS
    sources: [NutriRatio]
    info:
      path: NutriRatio/Resources/Info.plist
      properties:
        CFBundleDisplayName: NutriRatio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "L'appareil photo sert à scanner le code-barres d'un produit ou à photographier son tableau nutritionnel. Les images restent sur votre iPhone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinegautier.NutriRatio
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F63NBS5W46
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NutriRatioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NutriRatioTests]
    dependencies:
      - target: NutriRatio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.antoinegautier.NutriRatioTests
schemes:
  NutriRatio:
    build:
      targets:
        NutriRatio: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [NutriRatioTests]
